name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chatroon-backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Unit Tests
        run: mvn test

      - name: Build Production Artifact
        run: mvn clean package -DskipTests

      - name: Verify Backend Build Artifact
        run: ls -la target/*.jar

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-artifact
          path: chatroon-backend/target/*.jar
          retention-days: 7

  frontend-build:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chatroom-ui

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: chatroom-ui/package-lock.json

      - name: Install Frontend Dependencies
        run: npm install

      - name: Check Linting
        run: npm run lint

      - name: Run Frontend Unit Tests
        run: npx vitest run --passWithNoTests

      - name: Build Production Frontend
        run: npm run build

      - name: Verify Frontend Build Artifact
        run: ls -la dist/

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-artifact
          path: chatroom-ui/dist/
          retention-days: 7
